<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IWASP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#080808;color:#fff;min-height:100vh;padding-bottom:90px}
.top{padding:20px 16px 0;text-align:center;background:#0f0f0f;border-bottom:1px solid #1a1a1a}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px}
.wasp-badge{width:52px;height:52px;background:#FFCC00;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;border:2.5px solid #000;box-shadow:0 0 0 2.5px #FFCC00,0 6px 20px rgba(255,204,0,0.5);transform:rotate(-8deg);flex-shrink:0}
.iwasp-title{font-family:'Bungee', cursive;font-size:48px;font-weight:400;letter-spacing:1px;color:#FFCC00;line-height:1;text-transform:uppercase;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.uid{color:#FFCC00;font-size:12px;font-weight:700;margin-top:10px;opacity:0.9;letter-spacing:1.5px;font-family:'Inter',sans-serif}
.yellow-line{height:2px;background:#FFCC00;margin:16px auto;width:92%}
.card{background:#121212;border:1px solid #262626;border-radius:20px;padding:18px;margin:0 14px 14px}
.card-title{font-weight:800;font-size:15px;color:#FFCC00}
.balance-amount{font-size:56px;font-weight:900;color:#FFCC00;margin:10px 0 4px;letter-spacing:-1px}
.balance-sub{font-size:12px;color:#FFCC00;font-weight:600;opacity:0.85}
.daily-badge{position:absolute;top:16px;right:16px;background:#1c1c1c;border:1px solid #FFCC00;border-radius:14px;padding:6px 10px;font-size:10px;text-align:center;color:#fff;font-weight:600}
.daily-badge b{background:#FFCC00;color:#000;padding:3px 8px;border-radius:20px;font-size:9px;display:block;margin-bottom:4px;font-weight:900}
.earn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.earn-item{background:#1A1A1A;border:1px solid #2E2E2E;border-radius:16px;padding:18px 6px;text-align:center;font-size:12px;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px}
.earn-icon{font-size:26px}
.btn-yellow{background:#FFCC00;color:#000;font-weight:900;border:none;width:100%;padding:16px;border-radius:14px;font-size:16px;cursor:pointer}
.input-dark{width:100%;background:#1A1A1A;border:1px solid #2E2E2E;border-radius:12px;padding:14px;color:#fff;font-size:14px;margin:10px 0}
.tab{display:none}.tab.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px 0 20px;z-index:99;border-radius:24px 24px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;opacity:0.35}
.nav-item.active{opacity:1}
.nav-icon{font-size:24px}
.nav-label{font-size:10px;font-weight:600}
</style>
</head>
<body>
<div class="top">
  <div class="logo-wrap">
    <div class="wasp-badge">🐝</div>
    <div class="iwasp-title">IWASP</div>
  </div>
  <div class="uid">UID <span id="uidTxt">583826997</span></div>
  <div class="yellow-line"></div>
</div>

<div id="tab-home" class="tab active">
  <div class="card" style="position:relative">
    <div class="card-title">💼 Total Balance</div>
    <div class="daily-badge"><b>DAILY CHECK-IN</b>Daily $0.10 • 1/5 tasks</div>
    <div class="balance-amount" id="bal">$0.00</div>
    <div class="balance-sub">Min withdraw $5 • USDT SOL</div>
  </div>
  <div class="card">
    <div class="card-title">⚡ Earn</div>
    <div class="earn-grid">
      <div class="earn-item"><div class="earn-icon">📋</div>Survey</div>
      <div class="earn-item"><div class="earn-icon">🎮</div>Game</div>
      <div class="earn-item"><div class="earn-icon">✅</div>Daily</div>
    </div>
    <button class="btn-yellow" onclick="openOfferwall()">Open Offerwall</button>
  </div>
</div>

<div id="tab-task" class="tab"><div class="card" style="height:75vh;padding:0;overflow:hidden"><iframe id="offerFrame" src="about:blank" style="width:100%;height:100%;border:none;background:#000"></iframe></div></div>
<div id="tab-country" class="tab"><div class="card"><div class="card-title">🐝 Wasp Country</div></div></div>
<div id="tab-refer" class="tab"><div class="card"><div class="card-title">👥 Referral</div><input class="input-dark" value="https://t.me/iwasp_bot?start=583826997" readonly><button class="btn-yellow">Copy Link</button></div></div>
<div id="tab-withdraw" class="tab"><div class="card"><div class="card-title">💸 Withdraw</div><p style="color:#888;font-size:12px;margin:8px 0">Balance: <b style="color:#FFCC00">$0.00</b> • Min $5 • USDT SOL</p><button class="btn-yellow" style="background:#1A1A1A;color:#FFCC00;border:1.5px solid #FFCC00">Request Withdraw</button></div></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('home')"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
  <div class="nav-item" onclick="switchTab('task')"><div class="nav-icon">📋</div><div class="nav-label">Task</div></div>
  <div class="nav-item" onclick="switchTab('country')"><div class="nav-icon">🐝</div></div>
  <div class="nav-item" onclick="switchTab('refer')"><div class="nav-icon">👥</div><div class="nav-label">Refer</div></div>
  <div class="nav-item" onclick="switchTab('withdraw')"><div class="nav-icon">⬇️</div><div class="nav-label">Withdraw</div></div>
</div>

<script>
function switchTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');document.querySelectorAll('.nav-item').forEach((el,i)=>{let names=['home','task','country','refer','withdraw'];el.classList.toggle('active',names[i]===n)})}
function openOfferwall(){let tg=window.Telegram?.WebApp;let realUid=tg?.initDataUnsafe?.user?.id||document.getElementById('uidTxt').innerText||"583826997";const CPA_APP_ID="YOUR_CPA_APP_ID_HERE";const wallUrl=`https://www.cpalead.com/appwall?app=${CPA_APP_ID}&subid=${realUid}`;document.getElementById('offerFrame').src=CPA_APP_ID==="YOUR_CPA_APP_ID_HERE"?"about:blank":wallUrl;switchTab('task')}
(function(){localStorage.setItem('iwasp_balance','0.00');let tg=window.Telegram?.WebApp;if(tg){tg.expand();let uid=tg.initDataUnsafe?.user?.id;if(uid)document.getElementById('uidTxt').innerText=uid;}document.getElementById('bal').innerText="$0.00"})()
</script>
</body>
</html>
