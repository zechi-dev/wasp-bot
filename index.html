<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWASP Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }

        .notif-btn {
            position: relative;
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-main);
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 6px;
            display: none;
        }

        .balance-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .wasp-amount {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-yellow);
            margin: 8px 0;
        }

        .usd-amount {
            font-size: 14px;
            color: var(--text-sub);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }

        .btn {
            background: var(--accent-yellow);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
        }

        /* Announcement Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .notif-item {
            border-bottom: 1px solid #334155;
            padding: 12px 0;
        }

        .notif-title { font-weight: bold; color: var(--accent-yellow); }
        .notif-date { font-size: 11px; color: var(--text-sub); }

        #browser-warning {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="user-avatar">U</div>
                <div>
                    <div id="user-name" style="font-weight: bold;">Loading...</div>
                    <div id="user-uid" style="font-size: 12px; color: var(--text-sub);">ID: ---</div>
                </div>
            </div>
            <button class="notif-btn" onclick="openAnnouncements()">
                🔔 <span class="badge" id="notif-badge">0</span>
            </button>
        </div>

        <div class="balance-card">
            <div style="font-size: 14px; color: var(--text-sub);">Approved Balance</div>
            <div class="wasp-amount"><span id="balance-wasp">0</span> WASP</div>
            <div class="usd-amount">≈ $<span id="balance-usd">0.00</span> USD</div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--accent-yellow);">
                Pending Bonus: <span id="pending-wasp">0</span> WASP ($<span id="pending-usd">0.00</span>)
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Earn Coins</h3>
                <p style="font-size: 12px; color: var(--text-sub);">Complete CPA offers to earn Wasp Coins.</p>
                <button class="btn" onclick="openOfferwall()">Offers</button>
            </div>
            <div class="card">
                <h3>Referrals</h3>
                <p style="font-size: 12px; color: var(--text-sub);">Earn $2.00 per qualified friend!</p>
                <button class="btn" onclick="copyReferralLink()">Copy Link</button>
            </div>
        </div>
    </div>

    <!-- Announcement Modal -->
    <div class="modal" id="notif-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Announcements</h2>
                <button onclick="closeAnnouncements()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
            </div>
            <div id="announcement-list">
                <p style="color: var(--text-sub);">No announcements yet.</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let UID = "";

        // Telegram Launch Lock
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tg.ready();
            tg.expand();
            UID = String(tg.initDataUnsafe.user.id);
            document.getElementById("user-name").innerText = tg.initDataUnsafe.user.first_name || "User";
            document.getElementById("user-avatar").innerText = (tg.initDataUnsafe.user.first_name || "U")[0].toUpperCase();
            document.getElementById("user-uid").innerText = "ID: " + UID;
            initUser();
            fetchAnnouncements();
        } else {
            document.getElementById("app-container").innerHTML = `
                <div style="text-align: center; padding: 50px 20px;">
                    <h2>🛑 Telegram Access Only</h2>
                    <p style="color: #94a3b8;">IWASP App can only be launched directly inside Telegram.</p>
                </div>
            `;
        }

        async function initUser() {
            const { data, error } = await supabaseClient.from('users').select('*').eq('telegram_id', UID).single();
            if (data) {
                updateBalances(data.balance || 0, data.pending_balance || 0);
            }
        }

        function updateBalances(balance, pending) {
            document.getElementById("balance-wasp").innerText = balance;
            document.getElementById("balance-usd").innerText = (balance / 100).toFixed(2);
            document.getElementById("pending-wasp").innerText = pending;
            document.getElementById("pending-usd").innerText = (pending / 100).toFixed(2);
        }

        async function fetchAnnouncements() {
            const { data, error } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending: false });
            if (data && data.length > 0) {
                document.getElementById("notif-badge").style.display = "inline";
                document.getElementById("notif-badge").innerText = data.length;
                let html = "";
                data.forEach(item => {
                    html += `
                        <div class="notif-item">
                            <div class="notif-title">${item.title}</div>
                            <div class="notif-date">${new Date(item.created_at).toLocaleString()}</div>
                            <p style="margin: 6px 0 0 0; font-size: 14px;">${item.message}</p>
                        </div>
                    `;
                });
                document.getElementById("announcement-list").innerHTML = html;
            }
        }

        function openAnnouncements() { document.getElementById("notif-modal").style.display = "block"; }
        function closeAnnouncements() { document.getElementById("notif-modal").style.display = "none"; }

        function copyReferralLink() {
            const link = `https://t.me/Iwasp_bot?start=${UID}`;
            navigator.clipboard.writeText(link);
            alert("Referral link copied!");
        }

        function openOfferwall() {
            window.location.href = `https://www.cpalead.com/dashboard/get-offers.php?id=YOUR_OFFERWALL_ID&subid=${UID}`;
        }
    </script>
</body>
</html>
