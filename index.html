<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IWASP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#080808;color:#fff;padding-bottom:80px}
.top{padding:20px;text-align:center;background:#0f0f0f}
.logo-wrap{display:flex;align-items:center;justify-content:center;gap:12px}
.badge{width:52px;height:52px;background:#FFCC00;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px}
.title{font-family:Bungee,cursive;font-size:46px;color:#FFCC00}
.card{background:#121212;border:1px solid #262626;border-radius:20px;padding:18px;margin:14px}
.bal{font-size:52px;font-weight:900;color:#FFCC00}
.btn{background:#FFCC00;color:#000;font-weight:900;border:none;width:100%;padding:16px;border-radius:14px;margin-top:12px}
</style>
</head>
<body>
<div class="top">
<div class="logo-wrap"><div class="badge">🐝</div><div class="title">IWASP</div></div>
<div style="color:#FFCC00;margin-top:8px;font-size:12px">UID <span id="uid">583826997</span></div>
</div>
<div class="card">
<div style="color:#FFCC00;font-weight:800">💼 Total Balance</div>
<div class="bal" id="bal">$0.00</div>
<div style="color:#FFCC00;font-size:12px">Min withdraw $5 • USDT SOL</div>
</div>
<div class="card">
<div style="color:#FFCC00;font-weight:800">⚡ Earn</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0">
<div style="background:#1A1A1A;padding:16px;border-radius:12px;text-align:center">📋<br>Survey</div>
<div style="background:#1A1A1A;padding:16px;border-radius:12px;text-align:center">🎮<br>Game</div>
<div style="background:#1A1A1A;padding:16px;border-radius:12px;text-align:center">✅<br>Daily</div>
</div>
<button class="btn" onclick="alert('Offerwall: UID '+document.getElementById('uid').innerText)">Open Offerwall</button>
</div>
<script>
let tg=window.Telegram?.WebApp; if(tg){tg.expand(); if(tg.initDataUnsafe?.user?.id) document.getElementById('uid').innerText=tg.initDataUnsafe.user.id;}
document.getElementById('bal').innerText="$0.00";
localStorage.setItem('iwasp_balance','0.00');
</script>
</body>
</html>
