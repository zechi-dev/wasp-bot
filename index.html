<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IWASP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0A08;--panel:#14120E;--panel2:#1A1712;--line:rgba(212,167,44,.16);--hair:rgba(237,230,211,.07);--gold:#D4A72C;--bone:#EDE6D3;--mute:#8A8374;--red:#D9776B;--green:#8FBF8A;--serif:'Instrument Serif',serif}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;display:flex;justify-content:center;color:var(--bone)}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--ink);position:relative;padding-bottom:120px}
#loader{position:fixed;inset:0;background:var(--ink);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#loader.hide{opacity:0;pointer-events:none}
.wasp-wrap{position:relative;width:200px;height:270px}
.loader-title{margin-top:26px;font-family:var(--serif);color:var(--bone);font-size:38px;letter-spacing:14px;padding-left:14px}
.loader-sub{color:var(--mute);font-size:12px;margin-top:10px}
.bar{width:120px;height:1px;background:var(--hair);margin-top:30px;overflow:hidden}
.bar-fill{height:100%;width:0;background:var(--gold);animation:fill 2.6s forwards}
@keyframes fill{to{width:100%}}
.header{padding:20px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:rgba(11,10,8,.94);z-index:10;border-bottom:1px solid var(--hair)}
.logo-box{width:34px;height:44px}
.iwasp-text{font-family:var(--serif);font-size:24px;letter-spacing:6px;color:var(--bone)}
.uid-text{color:var(--mute);font-size:11px;margin-top:5px}
.screen{display:none;padding:0 20px}.screen.active{display:block}
.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:16px;padding:22px 20px;margin-top:18px}
.label{color:var(--mute);font-size:12px}
.amount{font-family:var(--serif);color:var(--bone);font-size:58px;margin:16px 0 10px}
.meta{color:var(--mute);font-size:11px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid var(--hair);padding-top:16px}
.stat+.stat{border-left:1px solid var(--hair);padding-left:18px}
.stat-label{color:var(--mute);font-size:11px}
.stat-value{font-family:var(--serif);color:var(--bone);font-size:28px;margin-top:2px}
.payday{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px;padding:12px 4px}
.trending{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--hair);border-left:2px solid var(--gold);border-radius:12px;background:var(--panel);cursor:pointer}
.row{margin-top:10px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.input{width:100%;margin-top:12px;background:var(--ink);border:1px solid var(--hair);padding:14px;border-radius:10px;color:var(--bone);font-size:14px}
.input:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;margin-top:16px;background:var(--gold);color:#16110A;border:none;padding:15px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{background:var(--panel2);color:var(--mute)}
.warn{margin-top:14px;background:rgba(217,119,107,.07);border:1px solid rgba(217,119,107,.18);color:var(--red);padding:11px 12px;border-radius:10px;font-size:11px}
.badge{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600}
.badge-approved{color:var(--green);border:1px solid rgba(143,191,138,.25)}
.h{font-family:var(--serif);color:var(--bone);font-size:30px;margin:26px 0 4px}
.sub{color:var(--mute);font-size:12px;margin-bottom:6px}
.ref-link{margin-top:14px;background:var(--ink);border:1px solid var(--hair);border-radius:10px;padding:12px;font-size:12px;color:var(--mute);word-break:break-all}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(14,12,9,.96);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 14px;z-index:20}
.nav-item{text-align:center;color:#6A6458;font-size:10px;cursor:pointer}
.nav-item.active{color:var(--gold)}
